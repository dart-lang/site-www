- question: >-
    How do you construct a URL with query parameters using `Uri.https`?
  options:
    - text: >-
        Pass them as a third argument map:
        `Uri.https('api.com', '/search', {'q': 'dart'})`
      correct: true
      explanation: >-
        The third parameter accepts a `Map<String, dynamic>`
        of query parameters. Dart handles URL encoding automatically.
    - text: >-
        Append them to the path string: `Uri.https('api.com', '/search?q=dart')`
      correct: false
      explanation: >-
        Query parameters in the path string work but
        aren't the cleanest approach.
    - text: >-
        Use string concatenation: `Uri.https('api.com', '/search') + '?q=dart'`
      correct: false
      explanation: >-
        You can't concatenate strings to `Uri` objects using `+`.
        `Uri` provides a different mechanism for adding query parameters.
    - text: >-
        Call `.addQueryParam('q', 'dart')` on the `Uri` object.
      correct: false
      explanation: >-
        `Uri` objects are immutable and don't have an `addQueryParam` method.
        Query parameters must be specified differently.
- question: >-
    After calling `http.get(url)`,
    how should you check if the request was successful?
  options:
    - text: >-
        Check if `response.statusCode == 200` (or another success code).
      correct: true
      explanation: >-
        HTTP status codes indicate success (200-299)
        or various failures (400s, 500s).
        Always check before processing the response body.
    - text: >-
        Check if `response.body` is not empty.
      correct: false
      explanation: >-
        An empty body could be valid (like a 204 No Content).
        The body content alone doesn't tell you if the request succeeded.
    - text: >-
        Wrap the call in try/catch as successful requests don't throw.
      correct: false
      explanation: >-
        HTTP errors (such as 404 and 500) don't throw exceptions by default.
        The request completes normally even when the server returns an error.
    - text: >-
        Check if `response.isSuccess` returns true.
      correct: false
      explanation: >-
        There's no `isSuccess` property on `Response`.
        You need to examine a different property of the response object.
- question: >-
    When the Wikipedia API returns a non-200 status code,
    the lesson's API functions throw an `HttpException`
    instead of returning an error message string.
    Why is this a better practice for an API package?
  options:
    - text: >-
        It separates failure handling from valid data,
        letting functions return typed models (like `Summary`)
        while callers handle errors with `try`/`catch`.
      correct: true
      explanation: >-
        Returning an error string doesn't fit a return type like
        `Future<Summary>` and risks treating error text as article data.
        Throwing an `HttpException` signals failure explicitly so
        calling code can catch and handle it.
    - text: >-
        Because `http.get` crashes the Dart runtime
        if you don't throw an exception on non-200 status codes.
      correct: false
      explanation: >-
        `http.get` completes normally with a `Response` object
        even for 404 or 500 status codes.
        Throwing `HttpException` is a deliberate design choice,
        not a runtime requirement.
    - text: >-
        Throwing `HttpException` automatically retries
        the failed network request up to three times.
      correct: false
      explanation: >-
        Throwing an exception stops execution of the function
        and propagates the failure to the caller;
        it doesn't retry the request.
    - text: >-
        Functions marked `async` aren't allowed to return
        error strings when a network request fails.
      correct: false
      explanation: >-
        An `async` function can return any declared type
        (such as `Future<String>`, as in Chapter 3).
        Throwing an exception is preferred for type safety
        and structured error handling, not syntax rules.
