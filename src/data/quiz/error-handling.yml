- question: >-
    You're writing a function that parses user input.
    If the input is invalid,
    what's the best way to signal this to the calling code?
  options:
    - text: >-
        Throw an exception describing what went wrong.
      correct: true
      explanation: >-
        Throwing an exception immediately stops the invalid code path,
        provides a clear error message,
        and forces the caller to handle the error explicitly.
    - text: >-
        Return `null` and let the caller check for it.
      correct: false
      explanation: >-
        Returning `null` forces callers to remember to check for it.
        If they forget, bugs can occur silently.
        There's a more explicit way to signal problems.
    - text: >-
        Print an error message and continue execution.
      correct: false
      explanation: >-
        Printing doesn't stop invalid data from being used.
        The function would still need to return something,
        potentially causing bugs downstream.
    - text: >-
        Set a global error flag that other code can check.
      correct: false
      explanation: >-
        Global state is error-prone and easy to forget.
        This approach doesn't force callers to handle the error.
- question: >-
    In this lesson, why did you create a custom `ArgumentException` class
    that extends `FormatException` instead of just throwing a plain `String`?
  options:
    - text: >-
        It lets callers catch specific failure types with `on` clauses and
        attach structured context like `command` and `argumentName`.
      correct: true
      explanation: >-
        Custom exception classes integrate with type-based `on` clauses
        (such as `on ArgumentException` or `on FormatException`) and bundle
        helpful fields alongside the error message.
    - text: >-
        Dart's `throw` keyword only accepts subclasses of `FormatException`
        and can't throw strings or built-in exceptions.
      correct: false
      explanation: >-
        Technically, Dart allows throwing any non-null object,
        though Effective Dart recommends throwing `Exception` types
        for recoverable failures.
    - text: >-
        Custom exception classes are automatically caught and printed by Dart
        without needing a `try`/`catch` block.
      correct: false
      explanation: >-
        Custom exceptions behave like built-in exceptions—if uncaught,
        they still propagate up and terminate the program.
    - text: >-
        Extending `FormatException` turns runtime failures into compile-time
        errors so invalid user input is caught before the app runs.
      correct: false
      explanation: >-
        User command-line input isn't known until runtime,
        so invalid input is still handled at runtime with `try`/`catch`.
- question: >-
    Consider this code:
    `try { riskyOperation(); } on FormatException catch (e) { print(e); }`.
    What happens if `riskyOperation()` throws an `HttpException`?
  options:
    - text: >-
        The `HttpException` propagates up, uncaught by this try/catch.
      correct: true
      explanation: >-
        The `on` clause filters by exception type.
        Since `HttpException` isn't a `FormatException`,
        it bypasses this catch block entirely.
    - text: >-
        The `HttpException` is caught and printed.
      correct: false
      explanation: >-
        The `on FormatException` clause only
        catches `FormatException` and its subtypes.
        `HttpException` is a different type.
    - text: >-
        The program crashes because you can't use `on` with `catch`.
      correct: false
      explanation: >-
        `on Type catch (e)` is valid syntax that
        filters which exceptions to catch.
        The issue is the type mismatch, not the syntax.
    - text: >-
        The exception is silently ignored and execution continues.
      correct: false
      explanation: >-
        Exceptions are never silently ignored in Dart.
        If a catch block doesn't match, the exception doesn't just disappear.
- question: >-
    In Dart, what is the primary difference between an `Error` and an `Exception`?
  options:
    - text: >-
        An `Error` indicates a programming bug that shouldn't be caught,
        while an `Exception` represents an expected condition that code can recover from.
      correct: true
      explanation: >-
        Subtypes of `Error` (such as `RangeError` or `TypeError`) indicate bugs
        in code that you should fix. Subtypes of `Exception`
        (such as `FormatException` or `HttpException`) represent conditions
        that your code can anticipate and handle gracefully.
    - text: >-
        `Error` is thrown by the Dart runtime, while `Exception` can only be thrown by user code.
      correct: false
      explanation: >-
        Both the Dart runtime and user code can throw exceptions and errors.
    - text: >-
        `Exception` requires a `try/catch` block, but `Error` is ignored if uncaught.
      correct: false
      explanation: >-
        Uncaught errors and uncaught exceptions both terminate execution.
        Neither is silently ignored.
    - text: >-
        `Error` and `Exception` are identical in Dart and can be used interchangeably.
      correct: false
      explanation: >-
        Dart distinguishes between them by design:
        errors indicate bugs, while exceptions represent recoverable failures.
