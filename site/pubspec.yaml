name: dart_dev_site
publish_to: none
homepage: https://dart.dev

resolution: workspace
environment:
  sdk: ^3.13.0

dependencies:
  collection: ^1.19.1
  crypto: ^3.0.7
  # Used for accessing the SDK archive storage buckets.
  googleapis: ^16.0.0
  html: ^0.15.6
  http: ^1.6.0
  # Used for formatting dates in the SDK archive.
  intl: ^0.20.3
  jaspr: ^0.23.4
  jaspr_content: ^0.5.4
  # Used as our template engine.
  liquify: ^1.6.1
  markdown: ^7.3.1
  markdown_description_list: ^0.2.0
  meta: ^1.19.0
  nanoid2: ^2.1.0
  # Used for syntax highlighting.
  opal: ^0.2.4
  path: ^1.9.1
  # Used in the SDK archive.
  pub_semver: ^2.2.0
  universal_web: ^1.1.1+1
  # Used to build the Atom feed for the blog.
  xml: ^7.0.1
  yaml: ^3.1.4

dev_dependencies:
  analysis_defaults:
    git:
      url: https://github.com/flutter/website
      path: packages/analysis_defaults
      ref: 74b7c5c06ebe9bf8c3e007e120a71144af5eb175
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.4
  jaspr_test: ^0.23.4
  lints: ^6.1.0
  logging: ^1.3.0
  sass: ^1.104.1
  sass_builder: ^2.4.0+1
  skills_lint: ^0.5.1
  test: ^1.31.1

jaspr:
  mode: static
